<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./loginpage.css">
    <title>Sign In</title>
</head>

<body>
    <div class="container">
        <section class="leftSide">
            <div class="loginForm">
                <div>
                    <h1>Welcome Back 👋</h1>
                    <p>Today is a new day. It's your day. You shape it.
                        Sign in to start managing your projects.</p>
                </div>
                <form>
                    <div class="email">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Example@email.com">
                    </div>
                    <div class="password">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="At least 8 characters">
                    </div>
                    <div class="forgot">
                        <a href="#">Forgot Password?</a>
                    </div>
                    <button type="submit">Sign in</button>
                </form>
                <div class="divider">Or</div>
                <div class="socialSignin">
                    <button class="google" type="button">Sign in with Google</button>
                    <button class="facebook" type="button">Sign in with Facebook</button>
                </div>
                <div>
                    <p class="signUp">Don't have an account? <a href="#">Sign up</a></p>
                    <p class="reserved">© 2023 ALL RIGHTS RESERVED</p>
                </div>
            </div>
        </section>
        <section class="rightSide" aria-hidden="true"></section>
    </div>
</body>

</html>
